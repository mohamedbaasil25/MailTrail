

services:
  mongodb:
    image: mongo:latest
    container_name: email_intelligence_db
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: email_intelligence_redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  backend:
    build: .
    # Dev convenience: bind-mounts the host source tree over /app below,
    # which shadows the non-root ownership the Dockerfile sets up for
    # production - so this overrides back to root here specifically for
    # local development ergonomics. The production image (used by
    # docker-compose.prod.yml and cloud deploys) does NOT bind-mount source
    # and keeps running as the non-root `mailtrail` user.
    user: root
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    container_name: email_intelligence_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - MONGO_URI=mongodb://mongodb:27017/email_intelligence_db
      - REDIS_URL=redis://redis:6379
    depends_on:
      - mongodb
      - redis
    volumes:
      - .:/app
      - huggingface_cache:/root/.cache/huggingface
    restart: unless-stopped

volumes:
  mongodb_data:
  huggingface_cache:
