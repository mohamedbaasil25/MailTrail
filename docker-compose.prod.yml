services:
  backend:
    build: .
    container_name: mailtrail_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # These will be overridden by the .env file on the server
      - MONGO_URI=${MONGO_URI}
      - REDIS_URL=redis://redis:6379
    depends_on:
      - redis
    expose:
      - "8000"
    
  redis:
    image: redis:alpine
    container_name: mailtrail_redis
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: mailtrail_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

volumes:
  caddy_data:
  caddy_config:
