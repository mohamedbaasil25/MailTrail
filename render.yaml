services:
  - type: web
    name: mailtrail-backend
    env: docker
    plan: free
    branch: main
    healthCheckPath: /api/v1/health
    envVars:
      - key: ENV
        value: production
      - key: MONGO_URI
        sync: false # You will provide your MongoDB Atlas connection string in the Render Dashboard
      - key: MONGO_DB_NAME
        value: email_intelligence_db
      - key: JWT_SECRET_KEY
        generateValue: true # Render automatically generates a secure secret for this
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 120
      - key: ADMIN_USERNAME
        sync: false # Set a real admin username in the Render Dashboard
      - key: ADMIN_PASSWORD_HASH
        sync: false # Set a bcrypt hash of a real password - see README for how to generate one
      - key: ANALYST_USERNAME
        sync: false
      - key: ANALYST_PASSWORD_HASH
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false # REQUIRED: set to your actual frontend origin(s), comma-separated, e.g.
                     # https://mailtrail.example.com - a wildcard "*" is rejected at startup
                     # in production because it cannot work with cookie-based auth anyway.
      - key: ENABLE_HEAVY_NLP
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      # IMAP is disabled by default for the web service unless you fill these in via the dashboard
      - key: IMAP_SERVER
        value: ""
      - key: IMAP_USER
        value: ""
      - key: IMAP_PASS
        value: ""
