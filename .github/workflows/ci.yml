name: Continuous Integration

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    # Run a local MongoDB instance for the tests
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt -r requirements-dev.txt
        
    - name: Set up Test Environment
      run: |
        cp .env.example .env
        
    - name: Run PyTest
      env:
        MONGO_URI: mongodb://localhost:27017/
        PYTHONPATH: .
      run: |
        pytest tests/ -v

  security-scan:
    runs-on: ubuntu-latest
    # Advisory, not a merge gate: pip-audit/bandit findings need a human to
    # triage (a flagged transitive dep with no upgrade path yet shouldn't
    # block every PR). continue-on-error surfaces results in the run log
    # without turning a known, unfixed advisory into a permanent red X.
    continue-on-error: true

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt -r requirements-dev.txt

    - name: Dependency vulnerability scan (pip-audit)
      run: python scripts/security_scan.py --pip-audit-only

    - name: Static security analysis (bandit)
      run: python scripts/security_scan.py --bandit-only

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Build Docker Image
      run: |
        docker build -t mailtrail-backend .
